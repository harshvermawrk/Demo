<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taski</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="hero">
            <p class="eyebrow">Taski Planner</p>
            <h1>Build your task list as you go.</h1>
            <p class="intro">Every time you submit a new task, the list updates instantly and keeps your tasks saved in this browser.</p>
        </section>

        <section class="panel">
            <form class="task-form" id="taskForm">
                <label class="field">
                    <span>Task name</span>
                    <input id="taskInput" type="text" placeholder="Finish homepage copy" aria-label="Task name" required>
                </label>

                <label class="field">
                    <span>Due date</span>
                    <input id="taskDate" type="datetime-local" aria-label="Task deadline">
                </label>

                <button type="submit">Add Task</button>
            </form>

            <aside class="task-panel" aria-live="polite">
                <div class="task-panel-header">
                    <div>
                        <p class="eyebrow">Live List</p>
                        <h2>Task List</h2>
                    </div>
                    <span class="task-count" id="taskCount">0 tasks</span>
                </div>

                <p class="empty-state" id="emptyState">No tasks yet. Add one from the form and it will appear here automatically.</p>
                <ul class="task-list" id="taskList"></ul>
            </aside>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
